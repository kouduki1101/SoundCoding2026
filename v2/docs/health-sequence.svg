<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7587ac" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#253044}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#64738b}.label{font-size:23px;font-weight:600}.small{font-size:17px;fill:#596982}.box{fill:#fff;stroke:#d4dbea;stroke-width:2;rx:12}.line{fill:none;stroke:#7587ac;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="920" fill="#f7f8fc"/><text x="60" y="72" class="title">Code Groove / Scoped repository review</text><text x="60" y="110" class="sub">Read selected immutable implementations. Outside scope and runtime remain unverified.</text><rect x="50" y="150" width="260" height="80" class="box"/><text x="72" y="189" class="label">Human / browser</text><path d="M180 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="380" y="150" width="260" height="80" class="box"/><text x="402" y="189" class="label">Protected API</text><path d="M510 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="730" y="150" width="260" height="80" class="box"/><text x="752" y="189" class="label">Worker / Gemini</text><path d="M860 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="1090" y="150" width="260" height="80" class="box"/><text x="1112" y="189" class="label">Private store</text><path d="M1220 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><path d="M180 275 L510 275" class="line"/><text x="345.0" y="265.0" text-anchor="middle" class="small">1. Open pinned sources / choose scope</text><path d="M510 330 L860 330" class="line"/><text x="685.0" y="320.0" text-anchor="middle" class="small">2. Read roles / competing explanations</text><path d="M860 385 L1220 385" class="line"/><text x="1040.0" y="375.0" text-anchor="middle" class="small">3. Save map + detected debt candidates + unknowns</text><path d="M510 440 L180 440" class="line"/><text x="345.0" y="430.0" text-anchor="middle" class="small">4. Descriptive motifs / file and meaning layouts</text><path d="M180 495 L510 495" class="line"/><text x="345.0" y="485.0" text-anchor="middle" class="small">5. Listen / select a passage / ask a question</text><path d="M510 550 L860 550" class="line"/><text x="685.0" y="540.0" text-anchor="middle" class="small">6. Fresh targeted reads / legitimate boundaries</text><path d="M860 605 L1220 605" class="line"/><text x="1040.0" y="595.0" text-anchor="middle" class="small">7. Save findings / evidence / possible reinterpretation</text><path d="M510 660 L180 660" class="line"/><text x="345.0" y="650.0" text-anchor="middle" class="small">8. Review observation / tradeoff / limitation</text><path d="M180 715 L510 715" class="line"/><text x="345.0" y="705.0" text-anchor="middle" class="small">9. Explicitly reflect into a separate focused map</text><path d="M180 770 L510 770" class="line"/><text x="345.0" y="760.0" text-anchor="middle" class="small">10. Observe, or request an optional source proposal</text><text x="60" y="875" class="sub">Refactoring follows the separate approval sequence. Repeated roles are not defects; audio cannot recover unmapped information.</text></svg>