<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7587ac" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#253044}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#64738b}.label{font-size:23px;font-weight:600}.small{font-size:17px;fill:#596982}.box{fill:#fff;stroke:#d4dbea;stroke-width:2;rx:12}.line{fill:none;stroke:#7587ac;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="920" fill="#f7f8fc"/><text x="60" y="72" class="title">Code Groove / Human-approved improvement</text><text x="60" y="110" class="sub">A proposal changes nothing. Approval creates an app-only snapshot; independent review may retain a concern.</text><rect x="50" y="150" width="260" height="80" class="box"/><text x="72" y="189" class="label">Human / browser</text><path d="M180 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="380" y="150" width="260" height="80" class="box"/><text x="402" y="189" class="label">Protected API</text><path d="M510 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="730" y="150" width="260" height="80" class="box"/><text x="752" y="189" class="label">Worker / Gemini</text><path d="M860 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="1090" y="150" width="260" height="80" class="box"/><text x="1112" y="189" class="label">Private store</text><path d="M1220 230V830" stroke="#cbd5e6" stroke-dasharray="6 6"/><path d="M180 280 L510 280" class="line"/><text x="345.0" y="270.0" text-anchor="middle" class="small">1. Request a grounded improvement</text><path d="M510 340 L860 340" class="line"/><text x="685.0" y="330.0" text-anchor="middle" class="small">2. Reserve shared investigation quota</text><path d="M860 400 L1220 400" class="line"/><text x="1040.0" y="390.0" text-anchor="middle" class="small">3. Read base / tools / exact edit validation</text><path d="M860 460 L1220 460" class="line"/><text x="1040.0" y="450.0" text-anchor="middle" class="small">4. Store immutable draft + evidence</text><path d="M510 520 L180 520" class="line"/><text x="345.0" y="510.0" text-anchor="middle" class="small">5. Show diff / tradeoffs / pending checks</text><path d="M180 595 L510 595" class="line"/><text x="345.0" y="585.0" text-anchor="middle" class="small">6. Explicit accept or reject (no auto approval)</text><path d="M510 665 L1220 665" class="line"/><text x="865.0" y="655.0" text-anchor="middle" class="small">7. CAS base + draft state + analysis budget</text><path d="M510 735 L860 735" class="line"/><text x="685.0" y="725.0" text-anchor="middle" class="small">8. Re-index / review accepted snapshot</text><path d="M860 805 L1220 805" class="line"/><text x="1040.0" y="795.0" text-anchor="middle" class="small">9. Preserve original / publish new score</text><text x="60" y="875" class="sub">Compare with stable responsibility motifs. No GitHub writes or repository execution. Reject keeps the original; replay makes no model request.</text></svg>