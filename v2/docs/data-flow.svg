<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7587ac" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#253044}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#64738b}.label{font-size:23px;font-weight:600}.small{font-size:17px;fill:#596982}.box{fill:#fff;stroke:#d4dbea;stroke-width:2;rx:12}.line{fill:none;stroke:#7587ac;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="920" fill="#f7f8fc"/><text x="60" y="72" class="title">Code Groove / Data flow &amp; trust boundaries</text><text x="60" y="110" class="sub">Source is data, never executable. Firebase identifies the owner; metadata authorizes every access.</text><rect x="470" y="160" width="910" height="600" fill="#eef1fb" stroke="#c8d3eb" rx="20"/><text x="494" y="196" class="small">Google Cloud / private workload boundary</text><rect x="60" y="210" width="320" height="158" class="box"/><text x="82" y="249" class="label">User / browser</text><text x="82" y="283" class="small">Invited password login</text><text x="82" y="311" class="small">Questions / public repo URL</text><text x="82" y="339" class="small">Audio notes + source evidence</text><rect x="60" y="520" width="320" height="150" class="box"/><text x="82" y="559" class="label">Public GitHub</text><text x="82" y="593" class="small">HTTPS owner/repo allowlist</text><text x="82" y="621" class="small">Bounded sanitized archive</text><text x="82" y="649" class="small">No scripts / imports executed</text><rect x="510" y="230" width="330" height="155" class="box"/><text x="532" y="269" class="label">Protected Web API</text><text x="532" y="303" class="small">Firebase + server allowlist</text><text x="532" y="331" class="small">Ownership / origin / size</text><text x="532" y="359" class="small">Atomic quotas / expiry</text><rect x="1000" y="230" width="335" height="155" class="box"/><text x="1022" y="269" class="label">Private Worker</text><text x="1022" y="303" class="small">OIDC / durable lease</text><text x="1022" y="331" class="small">Read tools / bounded drafts</text><text x="1022" y="359" class="small">Reverified change reuse</text><rect x="510" y="540" width="330" height="180" class="box"/><text x="532" y="579" class="label">Firestore + Storage</text><text x="532" y="613" class="small">Owner-scoped metadata</text><text x="532" y="641" class="small">Immutable snapshot / result</text><text x="532" y="669" class="small">Private IAM / TTL / lifecycle</text><text x="532" y="697" class="small">No direct browser access</text><rect x="1000" y="540" width="335" height="180" class="box"/><text x="1022" y="579" class="label">Gemini on Google Cloud</text><text x="1022" y="613" class="small">ADK + Gen AI / ADC</text><text x="1022" y="641" class="small">Sanitized selected evidence</text><text x="1022" y="669" class="small">Structured claims / alternatives</text><text x="1022" y="697" class="small">No source write / approval tools</text><path d="M380 275 L510 275" class="line"/><text x="445.0" y="265.0" text-anchor="middle" class="small">source / question</text><path d="M840 315 L1000 315" class="line"/><text x="920.0" y="305.0" text-anchor="middle" class="small">OIDC task</text><path d="M380 580 L460 580" class="line"/><path d="M460 580 L460 425" class="line"/><path d="M460 425 L1100 425" class="line"/><text x="780.0" y="415.0" text-anchor="middle" class="small">pinned source / static index</text><path d="M1100 425 L1100 385" class="line"/><path d="M670 385 L670 540" class="line"/><text x="670.0" y="452.5" text-anchor="middle" class="small">metadata / saved score</text><path d="M1000 385 L840 540" class="line"/><text x="920.0" y="452.5" text-anchor="middle" class="small">snapshot / proofs / result</text><path d="M1167 385 L1167 540" class="line"/><text x="1167.0" y="452.5" text-anchor="middle" class="small">tools / validated candidate</text><text x="60" y="835" class="sub">Secret Manager: reviewer password. GitHub WIF: short-lived deploy identity. Logs exclude tokens, passwords and raw source.</text><text x="60" y="875" class="small">Public samples: authored fixtures or explicitly recorded real Gemini results. They never silently replace failed live analysis.</text></svg>