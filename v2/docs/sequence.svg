<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7587ac" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#253044}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#64738b}.label{font-size:23px;font-weight:600}.small{font-size:17px;fill:#596982}.box{fill:#fff;stroke:#d4dbea;stroke-width:2;rx:12}.line{fill:none;stroke:#7587ac;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="920" fill="#f7f8fc"/><text x="60" y="72" class="title">Code Groove / Agent &amp; playback sequence</text><text x="60" y="110" class="sub">Immutable evidence. Bounded tools. No model request during replay.</text><rect x="55" y="145" width="210" height="80" class="box"/><text x="77" y="184" class="label">Browser</text><path d="M160 225V810" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="335" y="145" width="210" height="80" class="box"/><text x="357" y="184" class="label">Web / Auth</text><path d="M440 225V810" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="615" y="145" width="210" height="80" class="box"/><text x="637" y="184" class="label">Worker / Queue</text><path d="M720 225V810" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="895" y="145" width="210" height="80" class="box"/><text x="917" y="184" class="label">ADK governed Agent</text><path d="M1000 225V810" stroke="#cbd5e6" stroke-dasharray="6 6"/><rect x="1175" y="145" width="210" height="80" class="box"/><text x="1197" y="184" class="label">Private store</text><path d="M1280 225V810" stroke="#cbd5e6" stroke-dasharray="6 6"/><path d="M160 275 L440 275" class="line"/><text x="300.0" y="265.0" text-anchor="middle" class="small">1. Login / owner-scoped source</text><path d="M440 335 L720 335" class="line"/><text x="580.0" y="325.0" text-anchor="middle" class="small">2. Reserve quota / OIDC task</text><path d="M720 395 L1280 395" class="line"/><text x="1000.0" y="385.0" text-anchor="middle" class="small">3. Pin / sanitize / index snapshot</text><path d="M720 465 L1000 465" class="line"/><text x="860.0" y="455.0" text-anchor="middle" class="small">4. Ask with authorized tool schema</text><path d="M1000 525 L720 525" class="line"/><text x="860.0" y="515.0" text-anchor="middle" class="small">5. Read / relations / alternative</text><path d="M720 605 L1280 605" class="line"/><text x="1000.0" y="595.0" text-anchor="middle" class="small">6. Validate evidence / compile score</text><path d="M160 675 L440 675" class="line"/><text x="300.0" y="665.0" text-anchor="middle" class="small">7. Retrieve saved interpretation</text><path d="M440 735 L160 735" class="line"/><text x="300.0" y="725.0" text-anchor="middle" class="small">8. Notes + exact source spans</text><rect x="640" y="415" width="438" height="145" fill="none" stroke="#8596bc" stroke-dasharray="5 4" rx="10"/><text x="663" y="437" class="small">Bounded adaptive tool loop</text><text x="60" y="870" class="sub">Compatible saved scope: zero model calls. Changed inputs invalidate cache. Cross-scope reconciliation is explicit and bounded.</text></svg>